name: iOS Release (match + TestFlight)

# Firma con fastlane match (certs cifrados en repo privado Pinan76-progana-certs)
# y sube a TestFlight. match REUSA los certs (no crea nuevos -> no choca con limites).
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY, MATCH_PASSWORD, MATCH_GIT_TOKEN

on:
  workflow_dispatch: {}
  push:
    branches: [feature/midnight-stadium-theme]
    paths:
      - '.github/workflows/ios-release.yml'

jobs:
  release-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
      TEAM_ID: "852RTXZJW4"
      BUNDLE_ID: "mx.progana.proganaApp"
      CERTS_REPO: "Pinan76/Pinan76-progana-certs"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencias
        run: flutter pub get
      - name: Generar carpeta iOS si falta
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org mx.progana --project-name progana_app .
          fi
      - name: Config Info.plist (nombre + compliance cifrado)
        run: |
          PL=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName PROGANA Fantasy" "$PL" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string PROGANA Fantasy" "$PL"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PL" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PL"
      - name: Preparar proyecto (xcconfig + pods)
        run: flutter build ios --release --no-codesign
      - name: Guardar la API Key como archivo .p8
        run: |
          printf '%s' "$ASC_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Verificar secrets (longitudes, sin exponer valores)
        run: |
          echo "MATCH_PASSWORD  len = ${#MATCH_PASSWORD}"
          echo "MATCH_GIT_TOKEN len = ${#MATCH_GIT_TOKEN}"
          if [ -z "$MATCH_GIT_TOKEN" ]; then echo "::error::MATCH_GIT_TOKEN vacio"; exit 1; fi
          if [ -z "$MATCH_PASSWORD" ]; then echo "::error::MATCH_PASSWORD vacio"; exit 1; fi

      - name: Crear Fastfile (match)
        run: |
          mkdir -p ios/fastlane
          cat > ios/fastlane/Fastfile <<'RUBY'
          default_platform(:ios)
          platform :ios do
            lane :beta do
              setup_ci
              key = app_store_connect_api_key(
                key_id: ENV["ASC_KEY_ID"],
                issuer_id: ENV["ASC_ISSUER_ID"],
                key_filepath: ENV["ASC_KEY_PATH"]
              )
              require "base64"
              auth = Base64.strict_encode64("x-access-token:#{ENV['MATCH_GIT_TOKEN']}")
              match(
                type: "appstore",
                app_identifier: ENV["BUNDLE_ID"],
                git_url: "https://github.com/#{ENV['CERTS_REPO']}.git",
                git_basic_authorization: auth,
                api_key: key,
                readonly: false
              )
              profile = ENV["sigh_#{ENV['BUNDLE_ID']}_appstore_profile-name"] \
                        || "match AppStore #{ENV['BUNDLE_ID']}"
              update_code_signing_settings(
                use_automatic_signing: false,
                path: "Runner.xcodeproj",
                team_id: ENV["TEAM_ID"],
                bundle_identifier: ENV["BUNDLE_ID"],
                code_sign_identity: "Apple Distribution",
                profile_name: profile,
                targets: ["Runner"]
              )
              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                configuration: "Release",
                export_method: "app-store",
                output_directory: "../build/ipa",
                clean: true,
                export_options: {
                  signingStyle: "manual",
                  provisioningProfiles: { ENV["BUNDLE_ID"] => profile }
                }
              )
              upload_to_testflight(
                api_key: key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          RUBY
          echo "Fastfile (match) creado"
      - name: match + firmar + subir a TestFlight
        working-directory: ios
        run: fastlane beta
      - name: Guardar IPA (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progana-ipa
          path: build/ipa/*.ipa
          if-no-files-found: warn
